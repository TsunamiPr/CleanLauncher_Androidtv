name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk TvLauncher.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TvLauncher-apk
          path: TvLauncher.apk
      # Unit tests run after the APK is safe; a failing test is reported but does not take the APK away.
      - name: Unit tests
        continue-on-error: true
        run: ./gradlew --no-daemon testReleaseUnitTest
